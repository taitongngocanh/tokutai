spring.application.name=habit-quest

# H2 Database
spring.datasource.url=jdbc:h2:mem:habitquest;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT - use JWT_SECRET env variable in production!
jwt.secret=${JWT_SECRET:habitquest-secret-key-must-be-at-least-256-bits-long-for-HS256}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Server
server.port=${PORT:8080}
