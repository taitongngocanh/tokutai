spring.application.name=habit-quest

# PostgreSQL - use your local PostgreSQL (user: postgres, password: 123456)
spring.datasource.url=jdbc:postgresql://localhost:5432/habitquest
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT - use JWT_SECRET env variable in production!
jwt.secret=${JWT_SECRET:habitquest-secret-key-must-be-at-least-256-bits-long-for-HS256}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Server
server.port=${PORT:8080}
